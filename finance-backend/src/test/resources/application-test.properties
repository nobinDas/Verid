# H2 in-memory datasource for tests (replaces PostgreSQL)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate — don't touch schema (repos are mocked; no SQL executed)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable Flyway in tests
spring.flyway.enabled=false

# JWT — same secret as main application.properties
app.jwt.secret=dGhpcy1pcy1hLXZlcnktc2VjdXJlLWp3dC1zZWNyZXQta2V5LWZvci1maW5hbmNlYXBwLTI1NmJpdA==
app.jwt.expiration-ms=86400000

# Gemini AI — test key (real HTTP calls mocked)
app.gemini.api-key=test-key

# CORS
app.cors.allowed-origins=http://localhost:5173

# Multipart
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
